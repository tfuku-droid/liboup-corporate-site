<!doctype html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ｜LiBoUp株式会社</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { navy: '#17233a', green: '#2f6f5e', bglight: '#fcfcfc' }, fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] } } }
    }
  </script>
  <style>
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
    .fade-up.is-visible { opacity: 1; transform: translateY(0); }
    .form-wrapper iframe { max-width: 100%; border: none; }
  </style>
</head>
<body class="bg-bglight text-navy font-sans font-normal leading-relaxed">

  <header class="fixed w-full top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 h-16 md:h-20 flex items-center justify-between">
      <a href="/" class="flex items-center opacity-90 hover:opacity-100 transition-opacity">
        <img src="/logo-fullcolor.jpg" alt="LiBoUp株式会社" class="h-7 md:h-9 object-contain">
      </a>
      <nav class="hidden md:flex items-center space-x-10 text-sm tracking-wide text-navy/90 font-medium">
        <a href="/#purpose" class="hover:text-green transition-colors">Purpose</a>
        <a href="/#vision" class="hover:text-green transition-colors">Vision</a>
        <a href="/#services" class="hover:text-green transition-colors">Services</a>
        <a href="/company" class="hover:text-green transition-colors">Company</a>
        <a href="/contact" class="text-green transition-colors">Contact</a>
      </nav>
      <button id="menu-btn" class="md:hidden p-2 -mr-2 text-navy focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="mobile-menu" class="fixed inset-0 z-[60] bg-white hidden flex-col opacity-0 transition-opacity duration-300">
    <div class="max-w-7xl w-full mx-auto px-6 h-16 md:h-20 flex items-center justify-between border-b border-gray-100">
      <a href="/" class="mobile-link flex items-center opacity-90">
        <img src="/logo-fullcolor.jpg" alt="LiBoUp株式会社" class="h-7 md:h-9 object-contain">
      </a>
      <button id="close-btn" class="p-2 -mr-2 text-navy focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div class="flex-grow flex flex-col items-center justify-center space-y-10 text-lg tracking-widest font-medium pb-20">
        <a href="/#purpose" class="mobile-link text-navy hover:text-green">Purpose</a>
        <a href="/#vision" class="mobile-link text-navy hover:text-green">Vision</a>
        <a href="/#services" class="mobile-link text-navy hover:text-green">Services</a>
        <a href="/company" class="mobile-link text-navy hover:text-green">Company</a>
        <a href="/contact" class="mobile-link text-navy hover:text-green">Contact</a>
    </div>
  </div>

  <main class="pt-32 pb-24 md:pt-48 md:pb-40 px-6">
    <div class="max-w-3xl mx-auto fade-up">
      <div class="text-center mb-10 md:mb-16">
        <h1 class="text-2xl md:text-3xl font-medium tracking-wide mb-6">お問い合わせ</h1>
        <p class="text-sm md:text-base text-navy/90 leading-relaxed">
          サービスに関するご質問やご相談は、<br class="md:hidden">下記のフォームよりお気軽にご連絡ください。
        </p>
      </div>
      
      <div class="bg-white p-4 sm:p-8 rounded-[2rem] border border-gray-100 shadow-[0_4px_24px_rgb(0,0,0,0.02)]">
        <div class="form-wrapper w-full overflow-hidden text-center">
          <iframe src="https://docs.google.com/forms/d/1RQuOX7dbtU20EmunIrNsBeGslYbVowPBAebi7Udz9dU/viewform?embedded=true" width="100%" height="1000" frameborder="0" marginheight="0" marginwidth="0">読み込み中…</iframe>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-gray-100 py-16 px-6 mt-8">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center md:items-start gap-10">
      <div class="flex flex-col items-center md:items-start">
        <img src="/logo-fullcolor.jpg" alt="LiBoUp株式会社" class="h-7 object-contain mb-5 opacity-90">
        <p class="text-xs text-navy/50 tracking-wider">Confidential,©2026 LiBoUp Co., Ltd.</p>
      </div>
      <div class="flex flex-wrap justify-center md:justify-end gap-x-8 gap-y-4 text-sm tracking-wide text-navy/80 font-medium">
        <a href="/company" class="hover:text-green transition-colors">会社概要</a>
        <a href="/law" class="hover:text-green transition-colors">特定商取引法</a>
        <a href="/privacy" class="hover:text-green transition-colors">プライバシーポリシー</a>
        <a href="/contact" class="hover:text-green transition-colors">お問い合わせ</a>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            obs.unobserve(entry.target);
          }
        });
      }, { root: null, rootMargin: '0px', threshold: 0.15 });
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

      const menuBtn = document.getElementById('menu-btn');
      const closeBtn = document.getElementById('close-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      const mobileLinks = document.querySelectorAll('.mobile-link');

      const openMenu = () => {
        mobileMenu.classList.remove('hidden');
        mobileMenu.classList.add('flex');
        setTimeout(() => mobileMenu.classList.remove('opacity-0'), 10);
        document.body.classList.add('overflow-hidden');
      };

      const closeMenu = () => {
        mobileMenu.classList.add('opacity-0');
        setTimeout(() => {
          mobileMenu.classList.add('hidden');
          mobileMenu.classList.remove('flex');
        }, 300);
        document.body.classList.remove('overflow-hidden');
      };

      menuBtn.addEventListener('click', openMenu);
      closeBtn.addEventListener('click', closeMenu);
      mobileLinks.forEach(link => link.addEventListener('click', closeMenu));
    });
  </script>
</body>
</html>
